<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Control Center - KopStore</title>
    <style>
        * { box-sizing: border-box; font-family: 'Phetsarath OT', sans-serif, Arial; }
        body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00e676; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { background: #00e676; color: #000; border-color: #00e676; }
        .card { background: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .btn-sm { padding: 7px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; margin-top: 8px; font-size: 13px; }
        .btn-green { background: #00e676; color: #000; }
        .btn-orange { background: #ff9800; color: #000; }
        .btn-red { background: #ff5252; color: #fff; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        
        /* ໜ້າຈໍລັອກລະຫັດຜ່ານ Admin */
        #adminLoginGate { max-width: 400px; margin: 80px auto; background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #00e676; text-align: center; }
        #adminLoginGate input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; margin: 15px 0; text-align: center; font-size: 16px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- ລະບົບຄວາມປອດໄພ: ປ້ອນລະຫັດຜ່ານ Admin ກ່ອນເຂົ້າຈັດການ -->
<div id="adminLoginGate">
    <h2 style="margin-top:0;">🔐 Admin Security</h2>
    <p style="font-size:13px; color:#aaa;">ກະລຸນາປ້ອນລະຫັດຜ່ານຜູ້ດູແລລະບົບ KopStore</p>
    <input type="password" id="adminPassInput" placeholder="ປ້ອນລະຫັດຜ່ານ Admin...">
    <button class="btn-sm btn-green" style="width:100%; padding:12px; font-size:15px;" onclick="unlockAdmin()">🚀 ເຂົ້າສູ່ລະບົບຈັດການ</button>
</div>

<!-- ໜ້າຈັດການຫຼັກຂອງ Admin -->
<div class="container" id="adminMainPanel" style="display:none;">
    <h2>🛠️ KopStore Admin Dashboard</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('usersTab', this)">👥 ສະມາຊິກ / KYC / ເຕີມເງິນ</button>
        <button class="tab-btn" onclick="switchTab('ordersTab', this)">🧾 ລາຍການຊື້-ຂາຍ (Escrow)</button>
        <button class="tab-btn" onclick="switchTab('accountsTab', this)">🎮 ໄອດີເກມທັງໝົດ</button>
    </div>

    <!-- ແຖບທີ 1: ຈັດການສະມາຊິກ, ອະນຸມັດ KYC ແລະ ເຕີມເງິນ Wallet -->
    <div id="usersTab"></div>

    <!-- ແຖບທີ 2: ຕິດຕາມລາຍການຊື້-ຂາຍ Escrow -->
    <div id="ordersTab" style="display:none;"></div>

    <!-- ແຖບທີ 3: ຈັດການໄອດີເກມ -->
    <div id="accountsTab" style="display:none;"></div>
</div>

<script>
    // ຕັ້ງລະຫັດຜ່ານສຳລັບ Admin (ສາມາດປ່ຽນໄດ້ຕາມຕ້ອງການ)
    const ADMIN_SECRET_PASS = "KOP2026ADMIN";

    function unlockAdmin() {
        const pass = document.getElementById('adminPassInput').value;
        if (pass === ADMIN_SECRET_PASS) {
            document.getElementById('adminLoginGate').style.display = 'none';
            document.getElementById('adminMainPanel').style.display = 'block';
            initAdminData();
        } else {
            alert('❌ ລະຫັດຜ່ານ Admin ບໍ່ຖືກຕ້ອງ!');
        }
    }

    function switchTab(tabId, btn) {
        document.getElementById('usersTab').style.display = 'none';
        document.getElementById('ordersTab').style.display = 'none';
        document.getElementById('accountsTab').style.display = 'none';
        document.getElementById(tabId).style.display = 'block';

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    const firebaseConfig = {
        apiKey: "AIzaSyAwO0JXBBPZdmDBRYKXVOpVKXQCqzFWNI",
        authDomain: "kopstore-sk.firebaseapp.com",
        databaseURL: "https://kopstore-sk-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kopstore-sk",
        storageBucket: "kopstore-sk.firebasestorage.app",
        messagingSenderId: "4B3901320885",
        appId: "1:403901320885:web:e55d17ef726ab5169b87e4"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function initAdminData() {
        // 1. ໂຫຼດຂໍ້ມູນສະມາຊິກ, KYC ແລະ Wallet
        database.ref('users').on('value', (snap) => {
            const box = document.getElementById('usersTab');
            box.innerHTML = '<h3>👥 ລາຍຊື່ສະມາຊິກ & ການກວດສອບ KYC</h3>';
            const users = snap.val();
            if (!users) { box.innerHTML += '<p>ຍັງບໍ່ມີສະມາຊິກ</p>'; return; }

            Object.keys(users).forEach((phone) => {
                const u = users[phone];
                let kycBadge = `<span class="badge" style="background:#ff5252;">ຍັງບໍ່ KYC</span>`;
                if (u.kycStatus === 'pending') kycBadge = `<span class="badge" style="background:#ffeb3b; color:#000;">⏳ ລໍຖ້າກວດສອບ KYC</span>`;
                if (u.kycStatus === 'approved') kycBadge = `<span class="badge" style="background:#00e676; color:#000;">✅ KYC ຜ່ານແລ້ວ</span>`;

                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <b>📞 ເບີໂທ: ${phone}</b>
                        ${kycBadge}
                    </div>
                    <div style="font-size:13px; color:#ddd; margin-top:5px;">ຊື່ KYC: <b>${u.kycName || '-'}</b> | ຮ້ານຄ້າ: <b>${u.isSeller ? 'ເປີດແລ້ວ' : 'ຍັງບໍ່ເປີດ'}</b></div>
                    <div style="font-size:14px; color:#00e676; margin-top:5px;">💰 ຍອດເງິນ Wallet: <b>${Number(u.balance || 0).toLocaleString()} LAK</b></div>
                    <div>
                        <button class="btn-sm btn-orange" onclick="topupWallet('${phone}', ${u.balance || 0})">➕ ເຕີມເງິນ Wallet</button>
                        ${u.kycStatus !== 'approved' ? `<button class="btn-sm btn-green" onclick="approveKYC('${phone}')">✅ ອະນຸມັດ KYC</button>` : ''}
                    </div>
                `;
                box.appendChild(div);
            });
        });

        // 2. ໂຫຼດລາຍການຊື້-ຂາຍ (Orders Escrow)
        database.ref('orders').on('value', (snap) => {
            const box = document.getElementById('ordersTab');
            box.innerHTML = '<h3>🧾 ປະຫວັດ ແລະ ສະຖານະການຊື້-ຂາຍ Escrow</h3>';
            const orders = snap.val();
            if (!orders) { box.innerHTML += '<p>ຍັງບໍ່ມີລາຍການສັ່ງຊື້</p>'; return; }

            Object.keys(orders).forEach((id) => {
                const o = orders[id];
                const statusColor = o.status === 'completed' ? '#00e676' : '#ff9800';
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between;">
                        <b>🎮 ${o.gameType}</b>
                        <span class="badge" style="background:${statusColor}; color:#000;">${o.status === 'completed' ? 'ສຳເລັດແລ້ວ' : '⏳ ກຳລັງຖືເງິນກາງ'}</span>
                    </div>
                    <div style="font-size:13px; margin-top:5px;">ຜູ້ຊື້: <b>${o.buyerPhone}</b> ➡️ ຜູ້ຂາຍ: <b>${o.sellerPhone}</b></div>
                    <div style="font-size:13px; color:#ddd; margin-top:4px;">ລາຄາ: <b>${Number(o.price).toLocaleString()} LAK</b> | ຄ່າທຳນຽມຮ້ານ (5.89%): <b style="color:#00e676;">${Number(o.fee).toLocaleString()} LAK</b></div>
                `;
                box.appendChild(div);
            });
        });

        // 3. ໂຫຼດໄອດີເກມທັງໝົດ
        database.ref('accounts').on('value', (snap) => {
            const box = document.getElementById('accountsTab');
            box.innerHTML = '<h3>🎮 ໄອດີເກມທີ່ລົງຂາຍທັງໝົດ</h3>';
            const data = snap.val();
            if (!data) { box.innerHTML += '<p>ຍັງບໍ່ມີໄອດີ</p>'; return; }

            Object.keys(data).forEach((key) => {
                const acc = data[key];
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div><b>${acc.gameType}</b> - ລາຄາ: <b style="color:#00e676;">${Number(acc.price).toLocaleString()} LAK</b> (ສະຖານະ: ${acc.status})</div>
                    <div style="font-size:12px; color:#aaa;">ຜູ້ຂາຍ: ${acc.sellerPhone} | ອີເມວ: ${acc.gameEmail}</div>
                    <button class="btn-sm btn-red" onclick="deleteAccount('${key}')">🗑️ ລຶບໄອດີ</button>
                `;
                box.appendChild(div);
            });
        });
    }

    function topupWallet(phone, currentBalance) {
        const amountStr = prompt(`ປ້ອນຈຳນວນເງິນ (LAK) ທີ່ຕ້ອງການເຕີມໃຫ້ເບີ ${phone}:`);
        const amount = parseFloat(amountStr);
        if (!amount || amount <= 0) return;

        database.ref('users/' + phone).update({
            balance: currentBalance + amount
        }).then(() => {
            alert(`✅ ເຕີມເງິນ ${amount.toLocaleString()} LAK ໃຫ້ເບີ ${phone} ສຳເລັດ!`);
        });
    }

    function approveKYC(phone) {
        if (confirm(`ຢືນຢັນອະນຸມັດ KYC ໃຫ້ເບີ ${phone}?`)) {
            database.ref('users/' + phone).update({ kycStatus: 'approved' }).then(() => {
                alert('✅ ອະນຸມັດ KYC ສຳເລັດ!');
            });
        }
    }

    function deleteAccount(id) {
        if (confirm('⚠️ ຕ້ອງການລຶບໄອດີນີ້ແທ້ບໍ?')) {
            database.ref('accounts/' + id).remove();
        }
    }
</script>

</body>
</html>
