<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KopStore</title>
    <style>
        * { box-sizing: border-box; font-family: 'Phetsarath OT', sans-serif, Arial; }
        body { background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #00e676; margin-bottom: 25px; }
        .account-card { background: #2a2a2a; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .account-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 8px; }
        .game-badge { background: #00e676; color: #000; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .account-info { font-size: 14px; margin-bottom: 6px; color: #ddd; }
        .secret-box { background: rgba(255, 152, 0, 0.1); border: 1px dashed #ff9800; padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 13px; color: #ffb74d; }
        .btn-action { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 5px; margin-top: 10px; }
        .btn-approve { background: #00e676; color: #000; }
        .btn-delete { background: #ff5252; color: #fff; }
        .no-data { text-align: center; color: #77; padding: 30px; font-size: 16px; }
    </style>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>🛠️ Admin Management - KopStore</h2>
    <div id="accountsList">
        <div class="no-data">⏳ กำลังโหลดข้อมูล...</div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAwO0JXBBPZdmDBRYKXVOpVKXQCqzFWNI",
        authDomain: "kopstore-sk.firebaseapp.com",
        databaseURL: "https://kopstore-sk-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "kopstore-sk",
        storageBucket: "kopstore-sk.firebasestorage.app",
        messagingSenderId: "4B3901320885",
        appId: "1:403901320885:web:e55d17ef726ab5169b87e4"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ດຶງຂໍ້ມູນໄອດີທີ່ລົງຂາຍທັງໝົດຈາກ Firebase Realtime Database
    const accountsRef = database.ref('accounts');
    accountsRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const listContainer = document.getElementById('accountsList');
        listContainer.innerHTML = '';

        if (!data) {
            listContainer.innerHTML = '<div class="no-data">📭 ຍັງບໍ່ມີໄອດີລົງຂາຍໃນລະບົບ</div>';
            return;
        }

        Object.keys(data).forEach((key) => {
            const acc = data[key];
            
            let mediaHtml = '';
            if (acc.mediaUrls && acc.mediaUrls.length > 0) {
                mediaHtml = `<div style="margin-top:8px; font-size:12px; color:#00e676;">📁 ມີໄຟລ໌แนบ: ${acc.mediaUrls.length} ໄຟລ໌</div>`;
            }

            const card = document.createElement('div');
            card.className = 'account-card';
            card.innerHTML = `
                <div class="account-header">
                    <span class="game-badge">${acc.gameType}</span>
                    <span style="font-size: 12px; color: #aaa;">ສະຖານະ: <b>${acc.status}</b></span>
                </div>
                <div class="account-info">📞 ເບີຜູ້ຂາຍ: <b>${acc.sellerPhone}</b></div>
                <div class="account-info">💰 ລາຄາ: <b style="color:#00e676;">${Number(acc.price).toLocaleString()} LAK</b> (ຄ່າທຳນຽມ: ${Number(acc.fee).toLocaleString()} LAK)</div>
                <div class="account-info">💸 ຜູ້ຂາຍໄດ້ຮັບ: <b style="color:#ffeb3b;">${Number(acc.sellerReceive).toLocaleString()} LAK</b></div>
                <div class="account-info">📝 ໝາຍເຫດ: ${acc.description || 'ບໍ່ມີ'}</div>
                ${mediaHtml}
                
                <div class="secret-box">
                    🔒 <b>ข้อมูลลับ (Admin ເຫັນ):</b><br>
                    ອີເມວ/ໄອດີ: ${acc.gameEmail}<br>
                    ລະຫັດຜ່ານ: ${acc.gamePassword}
                </div>

                <div>
                    <button class="btn-action btn-approve" onclick="markAsSold('${key}')">✅ ປ່ຽນເປັນຂາຍແລ້ວ (Sold)</button>
                    <button class="btn-action btn-delete" onclick="deleteAccount('${key}')">🗑️ ລຶບໄອດີນີ້</button>
                </div>
            `;
            listContainer.appendChild(card);
        });
    });

    // ฟังก์ชันອັບເດດສະຖານະເປັນຂາຍແລ້ວ
    function markAsSold(id) {
        if (confirm('ຕ້ອງການປ່ຽນສະຖານະເປັນຂາຍແລ້ວແມ່ນບໍ?')) {
            database.ref('accounts/' + id).update({ status: 'sold' }).then(() => {
                alert('🎉 ອັບເດດສະຖານະສຳເລັດ!');
            });
        }
    }

    // ฟังก์ชันລຶບໄອດີ
    function deleteAccount(id) {
        if (confirm('⚠️ ທ່ານຕ້ອງການລຶບໄອດີນີ້ແທ້ບໍ?')) {
            database.ref('accounts/' + id).remove().then(() => {
                alert('🗑️ ລຶບຂໍ້ມູນສຳເລັດ!');
            });
        }
    }
</script>

</body>
</html>
