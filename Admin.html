<!DOCTYPE html>
<html lang="lo" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SK-KOP STORE - Admin Dashboard</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<!-- EmailJS ສຳລັບສົ່ງ OTP ໄປອີເມວ -->
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">🔒 SK-KOP STORE ADMIN</div>
    <div class="header-actions">
      <a href="index.html" class="btn-icon" style="text-decoration:none;">🏠 ກับໜ້າຮ້ານ</a>
    </div>
  </div>
</header>

<div class="container" style="max-width: 700px; margin-top: 20px;">
  
  <!-- 1. ລະບົບລັອກອິນດ້ວຍ OTP ຜ່ານອີເມວ -->
  <div id="adminLoginBox" style="background: var(--card-bg); padding: 20px; border-radius: 14px; border: 1px solid var(--border-color);">
    <h2 style="margin-bottom: 15px;">🔐 ເຂົ້າສູ່ລະບົບ Admin (OTP)</h2>
    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 15px;">ກົດປຸ່ມດ້ານລຸ່ມເພື່ອສົ່ງລະຫັດ OTP ໄປຍังອີເມວ Admin ທີ່ຕັ້ງຄ່າໄວ້.</p>
    
    <div id="stepRequestOtp">
      <button class="btn-primary" onclick="sendAdminOtp()">ສົ່ງລະຫັດ OTP ໄປອີເມວ</button>
    </div>

    <div id="stepVerifyOtp" style="display:none; margin-top: 15px;">
      <div class="form-group">
        <label>ປ້ອນລະຫັດ OTP 6 ຫຼັກທີ່ສົ່ງໄປອີເມວ</label>
        <input type="text" id="otpInput" class="form-control" placeholder="xxxxxx" maxlength="6">
      </div>
      <button class="btn-primary" onclick="verifyAdminOtp()">ຢືນຢັນ OTP ເຂົ້າສູ່ລະບົບ</button>
    </div>
  </div>

  <!-- 2. ດາບອດຈັດການຫຼັງບ້ານ (ສະແດງຫຼັງລັອກອິນສຳເລັດ) -->
  <div id="adminDashboardBox" style="display: none;">
    
    <!-- ຟອມເພີ່ມ / ຈັດການສິນຄ້າ -->
    <div style="background: var(--card-bg); padding: 20px; border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 20px;">
      <h2 style="color: var(--accent-color); margin-bottom: 15px;">➕ ເພີ່ມ / ຈັດການສິນຄ້າ</h2>
      
      <div class="form-group"><label>ຊື່ສິນຄ້າ</label><input type="text" id="admName" class="form-control" placeholder="ປ້ອນຊື່ສິນຄ້າ"></div>
      <div class="form-group"><label>ລາຄາປົກກະຕິ (KIP)</label><input type="number" id="admPrice" class="form-control" placeholder="ປ້ອນລາຄາ"></div>
      <div class="form-group"><label>ຈຳນວນສະຕ໊ອກ (Stock)</label><input type="number" id="admStock" class="form-control" placeholder="ຈຳນວນໃນສາງ"></div>
      <div class="form-group"><label>ລິ້ງຮູບພາບສິນຄ້າ (Image URL)</label><input type="text" id="admImg" class="form-control" placeholder="https://..."></div>
      
      <!-- ຕັ້ງໂຄດສ່ວນລົດ -->
      <h4 style="font-size: 14px; margin: 15px 0 8px; color: var(--text-color);">🏷 ຕັ້ງຄ່າສ່ວນລົດ (Promotion)</h4>
      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex:1;"><label>ส่วนລົດ (%)</label><input type="number" id="admDiscountPercent" class="form-control" placeholder="ເຊັ່ນ: 10"></div>
        <div class="form-group" style="flex:1;"><label>ສ່ວນລົດຕາມຈຳນວນຊື້ (ຂັ້ນຕ່ຳ)</label><input type="number" id="admDiscountMinQty" class="form-control" placeholder="ຊື້ຮອດຈຳນວນນີ້"></div>
      </div>

      <button class="btn-primary" onclick="addNewProduct()" style="margin-top: 10px;">ບັນທຶກສິນຄ້າລົງ Firebase</button>
    </div>

    <!-- 3. ລະບົບຈັດການອໍເດີ້ ແລະ ອັບເດດສະຖານະພັດສະດຸ -->
    <div style="background: var(--card-bg); padding: 20px; border-radius: 14px; border: 1px solid var(--border-color);">
      <h2 style="margin-bottom: 15px;">📦 ຈັດການອໍເດີ້ ແລະ ອັບເດດສະຖານະພັດສະດຸ</h2>
      <div id="ordersManageList"><p style="color: var(--text-secondary);">ກຳລັງໂຫຼດຂໍ້ມູນອໍເດີ້...</p></div>
    </div>

  </div>

</div>

<script>
const firebaseConfig = { 
  databaseURL: "https://sk-kop-store-default-rtdb.asia-southeast1.firebasedatabase.app" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ຕັ້ງຄ່າ EmailJS (ຕ້ອງໄປสมัคร EmailJS ຟຣີແລ້ວເອົາ Key ມາใส่)
// ຕອນນີ້ຕັ້ງຄ່າຈຳລອງລະບົບ OTP ไว้ໃຫ້ກ່ອນ
let generatedOtp = "";
const adminEmailTarget = "kopvithano@gmail.com"; // ປ່ຽນເປັນອີເມວຂອງທ່ານ

function sendAdminOtp() {
  // ສ້າງລະຫັດ OTP 6 ຫຼັກແບບຸ່ນ
  generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
  
  // ຈຳລອງການສົ່ງ OTP (ໃນລະບົບຕົວຈິງສາມາດເຊື່ອມ EmailJS ໄດ້)
  alert(`[ລະບົບຈຳລອງ OTP]: ສົ່ງລະຫັດໄປທີ່ອີເມວ ${adminEmailTarget} ແລ້ວ!\nລະຫັດ OTP ຂອງທ່ານคือ: ${generatedOtp}`);
  
  document.getElementById("stepRequestOtp").style.display = "none";
  document.getElementById("stepVerifyOtp").style.display = "block";
}

function verifyAdminOtp() {
  const enteredOtp = document.getElementById("otpInput").value.trim();
  if (enteredOtp === generatedOtp) {
    alert("ຢືນຢັນ OTP สำເລັດ!");
    document.getElementById("adminLoginBox").style.display = "none";
    document.getElementById("adminDashboardBox").style.display = "block";
    loadAdminOrders();
  } else {
    alert("ລະຫັດ OTP ບໍ່ຖືກຕ້ອງ ກະລຸນາລອງใหມ່!");
  }
}

function addNewProduct() {
  const name = document.getElementById("admName").value.trim();
  const price = Number(document.getElementById("admPrice").value);
  const stock = Number(document.getElementById("admStock").value) || 0;
  const image = document.getElementById("admImg").value.trim();
  const discountPercent = Number(document.getElementById("admDiscountPercent").value) || 0;
  const discountMinQty = Number(document.getElementById("admDiscountMinQty").value) || 1;

  if (!name || !price) {
    alert("ກະລຸນາປ້ອນຊື່ ແລະ ລາຄາສິນຄ້າໃຫ້ຄົບຖ້ວນ!");
    return;
  }

  const productData = {
    name,
    normalPrice: price,
    stock,
    image: image || 'https://via.placeholder.com/300',
    discountPercent,
    discountMinQty
  };

  db.ref('products').push(productData, (err) => {
    if (err) {
      alert("ເກີດຂໍ້ຜິດພາດ: " + err.message);
    } else {
      alert("ເພີ່ມສິນຄ້າສຳເລັດຮຽບຮ້ອຍ!");
      document.getElementById("admName").value = "";
      document.getElementById("admPrice").value = "";
      document.getElementById("admStock").value = "";
      document.getElementById("admImg").value = "";
      document.getElementById("admDiscountPercent").value = "";
      document.getElementById("admDiscountMinQty").value = "";
    }
  });
}

function loadAdminOrders() {
  db.ref('orders').on('value', (snapshot) => {
    const data = snapshot.val();
    const listDiv = document.getElementById("ordersManageList");
    if (!data) {
      listDiv.innerHTML = `<p style="color:var(--text-secondary);">ຍັງບໍ່ມີອໍເດີ້ເຂົ້າມາ</p>`;
      return;
    }

    let html = "";
    for (let id in data) {
      let o = data[id];
      html += `
        <div style="background:var(--bg-color); padding:12px; border-radius:10px; margin-bottom:12px; border:1px solid var(--border-color);">
          <p><b>ລູກຄ້າ:</b> ${o.name} (${o.phone})</p>
          <p><b>ທີ່ຢູ່:</b> ເມືອງ ${o.district}, ແຂວງ ${o.province}, ບ້ານ ${o.village}</p>
          <p><b>ยอดເງິນ:</b> ₭${Number(o.totalAmount).toLocaleString()} (${o.paymentMethod})</p>
          <p><b>ສະຖານະປັດຈຸບັນ:</b> <span style="color:var(--accent-color); font-weight:bold;">${o.status || 'ລໍຖ້າກວດສອບ'}</span></p>
          <p><b>ເລກບິນພັດສະດຸ (Tracking):</b> ${o.trackingNo || 'ຍັງບໍ່ມີ'}</p>
          
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <input type="text" id="track_${id}" class="form-control" placeholder="ປ້ອນເລກບິນ Anousith" style="flex:1; min-width:150px;" value="${o.trackingNo || ''}">
            <button class="btn-primary" style="width:auto; padding:8px 12px;" onclick="updateOrderStatus('${id}', 'ກຳລັງຈັດສົ່ງ')">ອັບເດດສົ່ງຂອງ</button>
            <button class="btn-primary" style="width:auto; padding:8px 12px; background:var(--danger-color);" onclick="updateOrderStatus('${id}', 'ยกເລີກ')">ยกເລີກ</button>
          </div>
        </div>
      `;
    }
    listDiv.innerHTML = html;
  });
}

function updateOrderStatus(orderId, newStatus) {
  const trackingNo = document.getElementById(`track_${orderId}`).value.trim();
  db.ref(`orders/${orderId}`).update({
    status: newStatus,
    trackingNo: trackingNo
  }, (err) => {
    if (!err) {
      alert("ອັບເດດສະຖານະ ແລະ ເລກບິນໃຫ້ລູກຄ້າສຳເລັດ!");
    }
  });
}
</script>

</body>
</html>
