<!DOCTYPE html>
<html lang="lo" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SK-KOP STORE - ຮ້ານຄ້າອອນລາຍ</title>
<link rel="stylesheet" href="style.css">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<header>
  <div class="header-container">
    <div class="logo">🛍 SK-KOP STORE</div>
    <div class="header-actions">
      <a href="admin.html" class="btn-icon" style="text-decoration:none; font-size:11px;">🔒 ແອັດມິນ</a>
      <button class="btn-icon" onclick="toggleTheme()">🌓</button>
      <button class="cart-btn" onclick="openCartModal()">🛒 <span id="cartCount">0</span></button>
    </div>
  </div>
</header>

<div class="container">
  <!-- BANNER & CATEGORY TABS -->
  <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 12px; text-align: center;">
    <h2 style="font-size: 15px; color: var(--accent-color); margin-bottom: 4px;">🔥 ສິນຄ້ານຳເຂົ້າຄຸນນະພາບ ຈັດສົ່ງທົ່ວ 18 ແຂວງ</h2>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px;">
    <button class="btn-icon" style="white-space: nowrap; background: var(--accent-color); color: #fff; border: none;">ທັງໝົດ</button>
    <button class="btn-icon" style="white-space: nowrap;">อะໄຫຼ່แต่งຈັກຍານຍົນ</button>
    <button class="btn-icon" style="white-space: nowrap;">ທໍ່ລົດ</button>
    <button class="btn-icon" style="white-space: nowrap;">ວັດສະດຸເຄືອບສີ</button>
  </div>

  <!-- SEARCH -->
  <div class="search-filter-box">
    <input type="text" id="searchInput" class="search-input" placeholder="🔎 ค้นຫາຊື່ສິນຄ້າ..." oninput="renderProducts()">
  </div>

  <!-- PRODUCTS GRID -->
  <h3 style="font-size: 15px; margin-bottom: 10px;">📦 ສິນຄ້າທັງໝົດ</h3>
  <div id="productsGrid" class="products-grid">
    <div class="empty-state">⏳ ກຳລັງໂຫຼດຂໍ້ມູນສິນຄ້າຈາກ Firebase...</div>
  </div>
</div>

<!-- CART & CHECKOUT MODAL -->
<div id="cartOverlay" class="overlay">
  <div class="modal-panel">
    <button class="close-btn" onclick="closeCartModal()">×</button>
    <h2>🛒 ກະຕ່າສິນຄ້າ</h2>
    <div id="cartItemsList" style="flex:1; overflow-y:auto; margin: 15px 0;"></div>
    
    <div id="checkoutFormSection" style="display:none; border-top: 1px solid var(--border-color); padding-top: 15px;">
      
      <!-- WHATSAPP OTP SECTION -->
      <div style="background:var(--bg-color); padding:12px; border-radius:10px; border:1px solid var(--border-color); margin-bottom:12px;">
        <h3 style="font-size: 13px; margin-bottom: 8px;">📲 ຢືນຢັນເບີ WhatsApp ຮັບOTP</h3>
        <div class="form-group" style="margin-bottom:8px;">
          <input type="tel" id="whatsappPhone" class="form-control" placeholder="20xxxxxxxx">
        </div>
        <button class="btn-primary" style="padding:8px; font-size:12px;" onclick="sendWhatsappOtp()">ສົ່ງລະຫັດ OTP</button>
        <div id="otpInputArea" style="display:none; margin-top:8px;">
          <input type="text" id="whatsappOtpCode" class="form-control" placeholder="ປ້ອນລະຫັດ OTP 6 ຫຼັກ" style="margin-bottom:6px;">
          <button class="btn-primary" style="padding:8px; font-size:12px; background:#198754;" onclick="verifyWhatsappOtp()">ຢືນຢັນ OTP ສຳເລັດ</button>
        </div>
      </div>

      <h3 style="font-size: 14px; margin-bottom: 8px;">📦 ຂໍ້ມູນການຈັດສົ່ງ</h3>
      <div class="form-group"><label>ຊື່ ແລະ ນາມສະກຸນ</label><input type="text" id="orderName" class="form-control" placeholder="ປ້ອນຊື່ຜູ້ຮັບ"></div>
      
      <div class="form-group">
        <label>ເລືອກບໍລິສັດຂົນສົ່ງ</label>
        <select id="shippingCompany" class="form-control">
          <option value="Anousith Express">Anousith Express</option>
          <option value="MiXay Express">MiXay Express</option>
        </select>
      </div>

      <div class="form-group">
        <label>ແຂວງ</label>
        <select id="provinceSelect" class="form-control" onchange="updateDistricts()">
          <option value="">-- ເລືອກແຂວງ --</option>
        </select>
      </div>
      <div class="form-group">
        <label>ເມືອງ</label>
        <select id="districtSelect" class="form-control">
          <option value="">-- ເລືອກເມືອງ --</option>
        </select>
      </div>
      <div class="form-group"><label>ຊື່ບ້ານ / ຈຸດສັງເກດ</label><input type="text" id="orderVillage" class="form-control" placeholder="ປ້ອນຊື່ບ້ານ"></div>

      <!-- PROMO CODE -->
      <div class="form-group">
        <label>ລະຫັດສ່ວນລົດ (Promo Code)</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="promoCodeInput" class="form-control" placeholder="ປ້ອນລະຫັດส่วนລົດ">
          <button class="btn-icon" style="width:90px;" onclick="applyPromoCode()">ໃຊ້ລະຫັດ</button>
        </div>
      </div>

      <!-- PAYMENT METHOD -->
      <div class="form-group">
        <label>ຮູບແບບການຊຳລະເງິນ</label>
        <select id="paymentMethod" class="form-control" onchange="togglePaymentDetails()">
          <option value="full">ຈ່າຍເຕັມຈຳນວນ (OnePay QR)</option>
          <option value="cod">ມັດຈຳ 30% + ຈ່າຍປາຍທາງ 70% (COD)</option>
        </select>
      </div>

      <div id="qrPaymentBox" style="background:var(--bg-color); padding:12px; border-radius:10px; text-align:center; margin-bottom:12px;">
        <p style="font-size:12px; font-weight:bold; margin-bottom:6px;">ສະແກນ QR ເພື່ອຊຳລະເງິນ OnePay</p>
        <img src="qr.png" alt="OnePay QR" style="max-width:140px; height:auto; border-radius:8px;" onerror="this.src='https://via.placeholder.com/150?text=QR+Code'">
        <p id="payAmountText" style="font-size:13px; font-weight:bold; color:var(--danger-color); margin-top:6px;"></p>
        <div style="margin-top:6px; text-align:left;">
          <label style="font-size:11px;">ອັບໂຫຼດຮູບສະລິບໂອນເງິນ</label>
          <input type="file" id="slipFile" class="form-control" accept="image/*" style="padding:4px;">
        </div>
      </div>
    </div>

    <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
      <div style="display:flex; justify-content:space-between; font-size:15px; font-weight:bold; margin-bottom:10px;">
        <span>ລວມທັງໝົດ:</span>
        <span id="cartTotalPrice" style="color:var(--danger-color);">₭0</span>
      </div>
      <button id="mainActionBtn" class="btn-primary" onclick="proceedToCheckout()">ດຳເນີນການສັ່ງຊື້</button>
    </div>
  </div>
</div>

<!-- PRODUCT DETAIL MODAL -->
<div id="productDetailOverlay" class="overlay">
  <div class="modal-panel">
    <button class="close-btn" onclick="closeProductModal()">×</button>
    <div id="productDetailContent"></div>
  </div>
</div>

<script>
const firebaseConfig = { 
  databaseURL: "https://sk-kop-store-default-rtdb.asia-southeast1.firebasedatabase.app" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

  "ແຂວງບໍລິຄຳໄຊ": ["ເມືອງປາກຊັນ", "ເມືອງທ່າພະບາດ", "ເມືອງປາກກະດິງ", "ເມືອງບໍລິຄັນ", "ເມືອງຄຳເກີດ", "ເມືອງວຽງທອງ"],

  "ແຂວງຜົ້ງສາລີ": ["ເມືອງຜົ້ງສາລີ", "ເມືອງມຸງ", "ເມືອງນໍ່", "ເມືອງຂວາ", "ເມືອງສຳພັນ", "ເມືອງບຸນໃຕ້"],

  "ແຂວງອັດຕະປື": ["ເມືອງສາມັກຄີໄຊ", "ເມືອງຊານໄຊ", "ເມືອງສະໜາມໄຊ", "ເມືອງສານຳໄຊ", "ເມືອງພູວົງ"],
  "ແຂວງໄຊສົມບູນ": ["ເມືອງອານຸວົງ", "ເມືອງລ້ອງຊານ", "ເມືອງຮົ່ມ", "ເມືອງທ່າໂທມ"]

let products = [];
let cart = JSON.parse(localStorage.getItem("kop_cart")) || [];
let isOtpVerified = false;
let discountMultiplier = 1;

window.addEventListener('DOMContentLoaded', () => {
  const provSelect = document.getElementById("provinceSelect");
  for (let prov in laoLocations) {
    let opt = document.createElement("option");
    opt.value = prov;
    opt.textContent = prov;
    provSelect.appendChild(opt);
  }
  loadProducts();
});

function updateDistricts() {
  const prov = document.getElementById("provinceSelect").value;
  const distSelect = document.getElementById("districtSelect");
  distSelect.innerHTML = '<option value="">-- ເລືອກເມືອງ --</option>';
  if (laoLocations[prov]) {
    laoLocations[prov].forEach(d => {
      let opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      distSelect.appendChild(opt);
    });
  }
}

function loadProducts() {
  db.ref('products').on('value', (snapshot) => {
    const data = snapshot.val();
    products = [];
    if (data) {
      for (let id in data) { products.push({ id, ...data[id] }); }
    }
    renderProducts();
  });
}

function money(num) {
  return "₭" + Number(num || 0).toLocaleString();
}

function renderProducts() {
  const grid = document.getElementById("productsGrid");
  const keyword = document.getElementById("searchInput").value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(keyword));

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">ບໍ່ພົບສິນຄ້າໃນລະບົບ</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => `
    <div class="product-card" onclick="openProductDetail('${p.id}')">
      <div class="product-img-wrap">
        <img src="${p.image || 'https://via.placeholder.com/300'}" alt="${p.name}">
      </div>
      <div class="product-info">
        <div class="product-title">${p.name}</div>
        <div class="product-price">${money(p.normalPrice || p.price)}</div>
        <div style="font-size:11px; color:var(--text-secondary);">ເຫຼືອ: ${p.stock || 0} ຊິ້ນ</div>
      </div>
    </div>
  `).join("");
}

function openProductDetail(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const content = document.getElementById("productDetailContent");
  content.innerHTML = `
    <img src="${p.image}" style="width:100%; height:220px; object-fit:cover; border-radius:10px; margin-bottom:10px;">
    <h2>${p.name}</h2>
    <div style="font-size:18px; font-weight:bold; color:var(--danger-color); margin:6px 0;">${money(p.normalPrice || p.price)}</div>
    <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">ສະຕ໊ອກພ້ອມສົ່ງ: ${p.stock || 0} ຊິ້ນ</p>
    
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:15px;">
      <span>ຈຳນວນ:</span>
      <button class="qty-btn" onclick="adjustDetailQty(-1)">-</button>
      <span id="detailQty" style="font-weight:bold;">1</span>
      <button class="qty-btn" onclick="adjustDetailQty(1)">+</button>
    </div>

    <button class="btn-primary" onclick="addDetailToCart('${p.id}')">🛒 ເພີ່ມໃສ່ກະຕ່າ / ซື້ດຽວນີ້</button>
  `;
  window.currentDetailId = id;
  window.currentDetailQty = 1;
  document.getElementById("productDetailOverlay").classList.add("show");
}

function adjustDetailQty(delta) {
  window.currentDetailQty = Math.max(1, (window.currentDetailQty || 1) + delta);
  document.getElementById("detailQty").innerText = window.currentDetailQty;
}

function addDetailToCart(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  const qty = window.currentDetailQty || 1;
  const item = cart.find(x => x.id === id);
  if (item) { item.qty += qty; } 
  else { cart.push({ id: p.id, name: p.name, price: p.normalPrice || p.price, image: p.image, qty: qty }); }
  saveCart();
  alert("ເພີ່ມສິນຄ້າລົງກະຕ່າແລ້ວ!");
  closeProductModal();
}

function closeProductModal() { document.getElementById("productDetailOverlay").classList.remove("show"); }

function saveCart() {
  localStorage.setItem("kop_cart", JSON.stringify(cart));
  updateCartUI();
}

function updateCartUI() {
  const count = cart.reduce((sum, i) => sum + i.qty, 0);
  document.getElementById("cartCount").innerText = count;

  const list = document.getElementById("cartItemsList");
  if (cart.length === 0) {
    list.innerHTML = `<div class="empty-state">ກະຕ່າຍັງວ່າງ</div>`;
    document.getElementById("cartTotalPrice").innerText = "₭0";
    return;
  }

  let total = 0;
  list.innerHTML = cart.map((i, idx) => {
    total += i.price * i.qty;
    return `
      <div class="cart-item">
        <img src="${i.image}">
        <div class="cart-item-info">
          <div class="cart-item-title">${i.name}</div>
          <div class="cart-item-price">${money(i.price)}</div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
            <span>${i.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
          </div>
        </div>
      </div>
    `;
  }).join("");

  const finalTotal = total * discountMultiplier;
  document.getElementById("cartTotalPrice").innerText = money(finalTotal);
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
}

function openCartModal() {
  updateCartUI();
  document.getElementById("cartOverlay").classList.add("show");
}
function closeCartModal() { document.getElementById("cartOverlay").classList.remove("show"); }

function sendWhatsappOtp() {
  const phone = document.getElementById("whatsappPhone").value.trim();
  if (!phone) { alert("ກະລຸນາປ້ອນເບີ WhatsApp!"); return; }
  alert("ສົ່ງລະຫັດ OTP ໄປທີ່ WhatsApp: " + phone + " ແລ້ວ! (ລະຫັດຈຳລອງ: 123456)");
  document.getElementById("otpInputArea").style.display = "block";
}

function verifyWhatsappOtp() {
  const code = document.getElementById("whatsappOtpCode").value.trim();
  if (code === "123456") {
    isOtpVerified = true;
    alert("ຢືນຢັນເບີ WhatsApp สำເລັດ!");
    document.getElementById("otpInputArea").style.display = "none";
  } else {
    alert("ລະຫັດ OTP ບໍ່ຖືກຕ້ອງ! (ລອງໃຊ້ 123456)");
  }
}

function applyPromoCode() {
  const code = document.getElementById("promoCodeInput").value.trim();
  if (code === "KOP10") {
    discountMultiplier = 0.9; // ลด 10%
    alert("ໃຊ້ລະຫັດສ່ວນລົດ 10% ສสำเร็จ!");
    updateCartUI();
  } else {
    alert("ລະຫັດສ່ວນລົດບໍ່ຖືກຕ້ອງ!");
  }
}

function proceedToCheckout() {
  if (cart.length === 0) { alert("ກະຕ່າຫວ່າງເປົ່າ"); return; }
  const formSec = document.getElementById("checkoutFormSection");
  if (formSec.style.display === "none") {
    formSec.style.display = "block";
    document.getElementById("mainActionBtn").innerText = "ຢືນຢັນການສັ່ງຊື້";
    togglePaymentDetails();
  } else {
    if (!isOtpVerified) {
      alert("ກະລຸນາຢືນຢັນເບີ WhatsApp ດ້ວຍ OTP ກ່ອນສັ່ງຊື້!");
      return;
    }

    const name = document.getElementById("orderName").value.trim();
    const phone = document.getElementById("whatsappPhone").value.trim();
    const shipping = document.getElementById("shippingCompany").value;
    const province = document.getElementById("provinceSelect").value;
    const district = document.getElementById("districtSelect").value;
    const village = document.getElementById("orderVillage").value.trim();

    if (!name || !province || !district || !village) {
      alert("ກະລຸນາປ້ອນຂໍ້ມູນການຈັດສົ່ງໃຫ້ຄົບຖ້ວນ!");
      return;
    }

    const subTotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const total = subTotal * discountMultiplier;

    const orderData = {
      name, phone, shipping, province, district, village,
      items: cart,
      totalAmount: total,
      paymentMethod: document.getElementById("paymentMethod").value,
      status: "ລໍຖ້າກວດສອບ",
      trackingNo: "",
      timestamp: Date.now()
    };

    db.ref('orders').push(orderData, (err) => {
      if (err) {
        alert("ເກີດຂໍ້ຜິດພາດ: " + err.message);
      } else {
        alert("ສັ່ງຊື້ສຳເລັດຮຽບຮ້ອຍ!");
        cart = [];
        saveCart();
        closeCartModal();
        location.reload();
      }
    });
  }
}

function togglePaymentDetails() {
  const method = document.getElementById("paymentMethod").value;
  const subTotal = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  const total = subTotal * discountMultiplier;
  const payText = document.getElementById("payAmountText");
  if (method === 'full') {
    payText.innerText = `ຍອດຈ່າຍເຕັມ: ${money(total)}`;
  } else {
    const deposit = total * 0.3;
    const cod = total * 0.7;
    payText.innerText = `ມັດຈຳ 30%: ${money(deposit)} (ສ່ວນທີ່ເຫຼືອ 70%: ${money(cod)} ຈ່າຍປາຍທາງ)`;
  }
}

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === "light" ? "dark" : "light";
}
</script>
