<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK-KOP STORE</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./">SK-KOP <small>STORE</small></a><div><button id="theme">◐</button> <button id="cartOpen">ກະຕ່າ <b id="count">0</b></button></div></header><section class="hero"><p>WELCOME TO SK-KOP STORE</p><h1>ຊື້ງ່າຍ.<br><em>ປອດໄພ.</em> ສະດວກ.</h1><p>ເລືອກສິນຄ້າທີ່ມັກ ແລ້ວສັ່ງຊື້ໄດ້ເລີຍ.</p><a href="#products">ເບິ່ງສິນຄ້າ ↓</a></section><main id="products"><div class="heading"><div><small>OUR COLLECTION</small><h2>ສິນຄ້າທັງໝົດ</h2></div><input id="search" placeholder="ຄົ້ນຫາສິນຄ້າ…"></div><div id="grid" class="grid">ກຳລັງໂຫຼດ…</div></main><aside id="cart" class="cart"><button id="cartClose">✕</button><h2>ກະຕ່າສິນຄ້າ</h2><div id="cartItems"></div><h3 id="total">ລວມ: 0 ₭</h3><button id="checkout">ດຳເນີນການສັ່ງຊື້</button></aside><dialog id="checkoutDialog"><form id="form"><button type="button" id="closeForm">✕</button><h2>ຂໍ້ມູນຈັດສົ່ງ</h2><label>ຊື່-ນາມສະກຸນ<input name="name" required></label><label>ເບີໂທ<input name="phone" required></label><label>ແຂວງ/ນະຄອນ<input name="province" required></label><label>ເມືອງ<input name="district" required></label><label>ບ້ານ<input name="village" required></label><label>ທີ່ຢູ່ລະອຽດ<input name="address" required></label><label>ວິທີຊຳລະ<select name="payment"><option value="full">ຊຳລະເຕັມຈຳນວນ</option><option value="deposit">COD: ມັດຈຳ 30%</option></select></label><p id="message"></p><button type="submit">ຢືນຢັນອໍເດີ</button><p class="note">ຕ້ອງຕັ້ງຄ່າ Backend ກ່ອນຮັບອໍເດີຈິງ.</p></form></dialog><footer><a href="tracking.html">ຕິດຕາມອໍເດີ</a> · <a href="admin.html">Admin</a></footer><script type="module" src="app.js"></script></body></html>
