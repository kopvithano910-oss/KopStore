<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ສະໝັກສະມາຊິກ - KOP STORE</title>
    <!-- ໃສ່ Link CSS ເກົ່າຂອງເຈົ້ານີ້ -->
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<div class="register-container">
    <h2>ສະໝັກສະມາຊິກ KOP STORE</h2>
    
    <form id="registerForm">
        <div class="form-group">
            <label>ເບີໂທລະສັບ ຫຼື ອີເມວ</label>
            <input type="text" id="regEmail" placeholder="ປ້ອນເບີໂທ (ເຊັ່ນ: 20xxxxxxxx) ຫຼື ອີເມວ" required />
        </div>
        
        <div class="form-group">
            <label>ລະຫັດຜ່ານ (Password)</label>
            <input type="password" id="regPassword" placeholder="ຕັ້ງລະຫັດຜ່ານ ຢ່າງໜ້ອຍ 6 ຕົວ" required />
        </div>
        
        <!-- ປຸ່ມສະໝັກ (ຮັກສາ Class ເດີມໄວ້) -->
        <button type="submit" class="btn-submit">ສະໝັກສະມາຊິກ</button>
    </form>

    <button id="googleSignInBtn" class="btn-google">ສະໝັກດ້ວຍ Google (Gmail)</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";

    // 🔴 ໃສ່ Config ໂປເຈັກ Firebase ຂອງເຈົ້າ
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        let inputVal = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        // ຖ້າຜູ້ໃຊ້ປ້ອນເປັນເບີໂທ (ຕົວເລກ) ລະບົບຈະແປງເປັນรูปแบบອີເມວອັດຕະໂນມັດເພື່ອບັນທຶກລົງ Firebase
        let email = inputVal;
        if (/^\d+$/.test(inputVal)) {
            email = `${inputVal}@kopstore-sk.com`;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            if (!email.endsWith('@kopstore-sk.com')) {
                await sendEmailVerification(user);
                alert('ສະໝັກສະມາຊິກສຳເລັດ! ກະລຸນາກວດສອບອີເມວເພື່ອຢືນຢັນຕົວຕົນ.');
            } else {
                alert('ສະໝັກສະມາຊິກດ້ວຍເບີໂທສຳເລັດ!');
            }

            window.location.href = 'index.html';
        } catch (error) {
            alert('ເກີດຄວາມຜິດພາດ: ' + error.message);
        }
    });

    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            await signInWithPopup(auth, provider);
            window.location.href = 'index.html';
        } catch (error) {
            alert('Google Sign-In ຜິດພາດ: ' + error.message);
        }
    });
</script>

</body>
</html>
