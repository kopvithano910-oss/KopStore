<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ສະໝັກສະມາຊິກ - KOP STORE</title>
    <style>
        body {
            font-family: 'Phetsarath OT', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .register-container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #16a34a;
        }
        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-google:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h2>ສະໝັກສະມາຊິກ KOP STORE</h2>
    
    <form id="registerForm">
        <div class="form-group">
            <label>ເບີໂທລະສັບ ຫຼື ອີເມວ</label>
            <input type="text" id="regEmail" placeholder="ປ້ອນເບີໂທ (ເຊັ່ນ: 20xxxxxxxx) ຫຼື ອີເມວ" required />
        </div>
        
        <div class="form-group">
            <label>ລະຫັດຜ່ານ (Password)</label>
            <input type="password" id="regPassword" placeholder="ຕັ້ງລະຫັດຜ່ານ ຢ່າງໜ້ອຍ 6 ຕົວ" required />
        </div>
        
        <button type="submit" class="btn-submit">ສະໝັກສະມາຊິກ</button>
    </form>

    <button id="googleSignInBtn" class="btn-google">ສະໝັກດ້ວຍ Google (Gmail)</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        let inputVal = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;

        let email = inputVal;
        if (/^\d+$/.test(inputVal)) {
            email = `${inputVal}@kopstore-sk.com`;
        }

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            if (!email.endsWith('@kopstore-sk.com')) {
                await sendEmailVerification(user);
                alert('ສະໝັກສະມາຊິກສຳເລັດ! ກະລຸນາກວດສອບອີເມວເພື່ອຢືນຢັນຕົວຕົນ.');
            } else {
                alert('ສະໝັກສະມາຊິກດ້ວຍເບີໂທສຳເລັດ!');
            }

            window.location.href = 'index.html';
        } catch (error) {
            alert('ເກີດຄວາມຜິດພາດ: ' + error.message);
        }
    });

    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            await signInWithPopup(auth, provider);
            window.location.href = 'index.html';
        } catch (error) {
            alert('Google Sign-In ຜິດພາດ: ' + error.message);
        }
    });
</script>

</body>
</html>
