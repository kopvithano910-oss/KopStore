<!-- ຕົວຢ່າງໂຄດສ່ວນຟອມສະໝັກໃນ register.html -->
<div class="register-container">
  <h2>ສະໝັກສະມາຊິກ KOP STORE</h2>
  
  <form id="registerForm">
    <div class="form-group">
      <label>ອີເມວ ຫຼື ເບີໂທລະສັບ</label>
      <input type="text" id="regEmail" placeholder="user@example.com ຫຼື 20xxxxxxxx" required />
    </div>
    
    <div class="form-group">
      <label>ລະຫັດຜ່ານ (Password)</label>
      <input type="password" id="regPassword" placeholder="ຢ່າງໜ້ອຍ 6 ຕົວອັກສອນ" required />
    </div>
    
    <button type="submit" class="btn-submit">ສະໝັກສະມາຊິກ</button>
  </form>

  <button id="googleSignInBtn" class="btn-google">ສະໝັກດ້ວຍ Google (Gmail)</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";

  // ຕັ້ງຄ່າ Firebase ຂອງທ່ານ
  const firebaseConfig = {
    // ໃສ່ Config ຂອງໂປເຈັກເຈົ້າ
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ຈັດການການສະໝັກດ້ວຍ Email/Phone + Password
  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    let inputVal = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;

    // ຖ້າຜູ້ໃຊ້ພິມເປັນເບີໂທ (ຕົວເລກ) ໃຫ້ແປງເປັນรูปแบบອີເມວຊົ່ວຄາວສຳລັບ Firebase Auth
    let email = inputVal;
    if (/^\d+$/.test(inputVal)) {
      email = `${inputVal}@kopstore-sk.com`;
    }

    try {
      // 1. ສร้างບັນຊີຜູ້ໃຊ້ໃໝ່
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // 2. ສົ່ງອີເມວຢືນຢັນ (ຖ້າເປັນອີເມວจริง)
      if (!email.endsWith('@kopstore-sk.com')) {
        await sendEmailVerification(user);
        alert('ສະໝັກສະມາຊິກสำเร็จ! ກະລຸນາກວດສອບອີເມວເພື່ອຢືນຢັນตัวຕົນ.');
      } else {
        alert('ສະໝັກສະມາຊິກດ້ວຍເບີໂທสำเร็จ!');
      }

      window.location.href = 'index.html';
    } catch (error) {
      alert('ເກີດຄວາມຜິດພາດ: ' + error.message);
    }
  });

  // ລັອກອິນ/ສະໝັກດ້ວຍ Google
  document.getElementById('googleSignInBtn').addEventListener('click', async () => {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
      window.location.href = 'index.html';
    } catch (error) {
      alert('Google Sign-In ຜິດພາດ: ' + error.message);
    }
  });
</script>
