<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເຂົ້າສູ່ລະບົບ - KOP STORE</title>
    <style>
        body { font-family: 'Phetsarath OT', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0056b3; }
        .btn-google { width: 100%; padding: 10px; background-color: #db4437; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-google:hover { background-color: #c23321; }
        .link-text { text-align: center; margin-top: 15px; font-size: 14px; }
        .link-text a { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>ເຂົ້າສູ່ລະບົບ KOP STORE</h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label>ອີເມວ ຫຼື ເບີໂທລະສັບ</label>
            <input type="text" id="loginEmail" placeholder="ອີເມວ ຫຼື 20xxxxxxxx" required />
        </div>
        
        <div class="form-group">
            <label>ລະຫັດຜ່ານ (Password)</label>
            <input type="password" id="loginPassword" placeholder="ລະຫັດຜ່ານ" required />
        </div>
        
        <button type="submit" class="btn-submit">ເຂົ້າສູ່ລະບົບ</button>
    </form>

    <button id="googleLoginBtn" class="btn-google">ເຂົ້າສູ່ລະບົບດ້ວຍ Google</button>

    <div class="link-text">
        ຍັງບໍ່ມີບັນຊີ? <a href="register.html">ສະໝັກສະມາຊິກທີ່ນີ້</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";

    // 🔴 ໃຫ້ປ່ຽນຄ່າ Config ນี้ເປັນຂອງໂປເຈັກ Firebase ຂອງທ່ານ
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        let inputVal = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        let email = inputVal;
        if (/^\d+$/.test(inputVal)) {
            email = `${inputVal}@kopstore-sk.com`;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert('ເຂົ້າສູ່ລະບົບສຳເລັດ!');
            window.location.href = 'index.html';
        } catch (error) {
            alert('ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ: ' + error.message);
        }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            await signInWithPopup(auth, provider);
            window.location.href = 'index.html';
        } catch (error) {
            alert('Google Sign-In ຜິດພາດ: ' + error.message);
        }
    });
</script>

</body>
</html>
