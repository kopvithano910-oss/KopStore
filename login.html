<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ເຂົ້າສູ່ລະບົບ - KOP STORE</title>
    <!-- ໃສ່ Link CSS ເກົ່າຂອງເຈົ້ານີ້ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h2>ເຂົ້າສູ່ລະບົບ KOP STORE</h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label>ເບີໂທລະສັບ ຫຼື ອີເມວ</label>
            <input type="text" id="loginEmail" placeholder="ປ້ອນເບີໂທ ຫຼື ອີເມວຂອງທ່ານ" required />
        </div>
        
        <div class="form-group">
            <label>ລະຫັດຜ່ານ (Password)</label>
            <input type="password" id="loginPassword" placeholder="ປ້ອນລະຫັດຜ່ານ" required />
        </div>
        
        <!-- ປຸ່ມເຂົ້າສູ່ລະບົບ (ຮັກສາ Class ເດີມໄວ້) -->
        <button type="submit" class="btn-submit">ເຂົ້າສູ່ລະບົບ</button>
    </form>

    <button id="googleLoginBtn" class="btn-google">ເຂົ້າສູ່ລະບົບດ້ວຍ Google</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.x.x/firebase-auth.js";

    // 🔴 ໃສ່ Config ໂປເຈັກ Firebase ຂອງເຈົ້າ
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        let inputVal = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        let email = inputVal;
        if (/^\d+$/.test(inputVal)) {
            email = `${inputVal}@kopstore-sk.com`;
        }

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert('ເຂົ້າສູ່ລະບົບສຳເລັດ!');
            window.location.href = 'index.html';
        } catch (error) {
            alert('ເຂົ້າສູ່ລະບົບບໍ່ສຳເລັດ: ' + error.message);
        }
    });

    document.getElementById('googleLoginBtn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            await signInWithPopup(auth, provider);
            window.location.href = 'index.html';
        } catch (error) {
            alert('Google Sign-In ຜິດພາດ: ' + error.message);
        }
    });
</script>

</body>
</html>
