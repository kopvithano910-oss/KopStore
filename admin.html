<!doctype html><html lang="lo"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK-KOP Admin</title><link rel="stylesheet" href="style.css"><style>.adminbox{max-width:1000px;margin:24px auto;padding:16px}.adminbox input,.adminbox select,.adminbox textarea{width:100%;margin:6px 0 12px;padding:12px;border-radius:10px;border:1px solid #aaa}.order{border:1px solid #ccc;border-radius:14px;padding:14px;margin:12px 0}.order img{max-width:240px;display:block;margin:8px 0}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.msg{padding:10px}</style></head><body><header><a class="brand" href="./">SK-KOP <small>ADMIN</small></a><a href="./">ກັບໜ້າຮ້ານ</a></header><main class="adminbox"><h1>ລະບົບ Admin</h1><p>ເຂົ້າລະບົບດ້ວຍບັນຊີ Firebase ທີ່ໄດ້ຮັບ admin custom claim ຈາກ backend ເທົ່ານັ້ນ.</p><form id="login"><label>ອີເມວ<input id="email" type="email" required autocomplete="username"></label><label>ລະຫັດຜ່ານ<input id="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">ເຂົ້າລະບົບ</button><button class="secondary" id="logout" type="button">ອອກຈາກລະບົບ</button></form><p id="msg" class="msg" aria-live="polite"></p><section id="panel" hidden><h2>ອໍເດີ</h2><button class="secondary" id="reload" type="button">ໂຫຼດອໍເດີໃໝ່</button><div id="orders"></div><hr><h2>ເພີ່ມ / ແກ້ໄຂສິນຄ້າ</h2><form id="productForm"><label>Product ID (ໃຊ້ລະຫັດເກົ່າເພື່ອແກ້ໄຂ)<input name="id" required></label><label>ຊື່ສິນຄ້າ<input name="name" required></label><div class="row"><label>ລາຄາ<input name="price" type="number" min="0" required></label><label>ສະຕັອກ<input name="stock" type="number" min="0" required></label><label>ລາຄາຫຼຸດ (ປ່ອຍວ່າງຖ້າບໍ່ມີ)<input name="salePrice" type="number" min="0"></label></div><label>URL ຮູບສິນຄ້າ<input name="image" type="url"></label><label>ລາຍລະອຽດ<textarea name="description"></textarea></label><div class="row"><label><input name="bestSeller" type="checkbox"> ສິນຄ້າຂາຍດີ</label><label><input name="active" type="checkbox" checked> ເປີດຂາຍ</label></div><button class="primary">ບັນທຶກສິນຄ້າ</button></form></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';import{firebaseConfig,API_BASE_URL}from'./firebase-config.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),$=id=>document.getElementById(id);let token='';const msg=s=>$('msg').textContent=s;async function api(path,opt={}){if(!API_BASE_URL)throw Error('ຕ້ອງກຳນົດ API_BASE_URL ໃນ firebase-config.js ຫຼັງຈາກ deploy backend');token=await auth.currentUser.getIdToken(true);let r=await fetch(API_BASE_URL+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,...opt.headers}});let d=await r.json();if(!r.ok)throw Error(d.error||'API error');return d} $('login').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value);const t=await auth.currentUser.getIdTokenResult(true);if(!t.claims.admin)throw Error('ບັນຊີນີ້ບໍ່ມີ Admin claim');$('panel').hidden=false;msg('ເຂົ້າລະບົບແລ້ວ');await loadOrders()}catch(e){msg(e.message)}};$('logout').onclick=()=>signOut(auth);$('reload').onclick=()=>loadOrders().catch(e=>msg(e.message));onAuthStateChanged(auth,async u=>{if(!u){$('panel').hidden=true;return}try{let t=await u.getIdTokenResult(true);if(t.claims.admin){$('panel').hidden=false;await loadOrders()}}catch(e){msg(e.message)}});async function loadOrders(){let a=await api('/api/admin/orders');$('orders').innerHTML='';for(let o of a){let el=document.createElement('article');el.className='order';el.innerHTML=`<h3>${o.orderId} — ${o.total} ₭</h3><p>${o.customer.name} | ${o.customer.phone}</p><p>${o.customer.province} / ${o.customer.district} / ${o.customer.village}</p><p>${o.items.map(x=>`${x.name} × ${x.quantity}`).join(', ')}</p><p>ຊຳລະ: ${o.paymentMethod==='deposit'?'ມັດຈຳ 30%':'ເຕັມຈຳນວນ'} | ສະຖານະ: ${o.status}</p><div class="row"><select class="status"><option>awaiting_payment</option><option>awaiting_review</option><option>paid</option><option>preparing</option><option>shipped</option><option>completed</option><option>rejected</option><option>cancelled</option></select><input class="tracking" placeholder="ເລກຕິດຕາມ" value="${o.trackingNumber||''}"><button class="primary update">ບັນທຶກສະຖານະ</button><button class="secondary slip">ເບິ່ງສະລິບ</button></div><div class="slipbox"></div>`;el.querySelector('.status').value=o.status;el.querySelector('.update').onclick=async()=>{try{await api('/api/admin/orders/'+o.orderId,{method:'PATCH',body:JSON.stringify({status:el.querySelector('.status').value,trackingNumber:el.querySelector('.tracking').value})});msg('ບັນທຶກແລ້ວ')}catch(e){msg(e.message)}};el.querySelector('.slip').onclick=async()=>{try{let s=await api('/api/admin/orders/'+o.orderId+'/slip');el.querySelector('.slipbox').innerHTML=`<img alt="ສະລິບທີ່ລູກຄ້າສົ່ງ" src="data:${s.mimeType};base64,${s.imageData}">`}catch(e){msg(e.message)}};$('orders').append(el)}};$('productForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),id=f.get('id'),p={name:f.get('name'),price:Number(f.get('price')),stock:Number(f.get('stock')),image:f.get('image'),description:f.get('description'),bestSeller:f.has('bestSeller'),active:f.has('active')};if(f.get('salePrice'))p.salePrice=Number(f.get('salePrice'));try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(p)});msg('ບັນທຶກສິນຄ້າແລ້ວ')}catch(e){msg(e.message)}};
</script></body></html>
